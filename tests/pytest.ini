; Config lives here, not in pyproject.toml, on purpose.
;
; This repo IS the plugin package: `__init__.py` sits at the repo root so
; Hermes can load the directory as `clawtalk`. If pytest's rootdir were the
; repo root, pytest would try to import that `__init__.py` as a test package -
; and fail, because the repo directory name is not a valid Python identifier.
; Keeping the ini file inside tests/ pins rootdir here instead.
;
; Run with:  pytest tests
[pytest]
addopts = --import-mode=importlib -q
filterwarnings =
    error::DeprecationWarning:clawtalk.*
